name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-tests:
    name: Shared tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, protocol-vector and integration tests
        run: ./gradlew desktopTest --continue
        shell: bash
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/"

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and assemble
        run: ./gradlew :android:lintDebug :android:assembleDebug :android:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: zoocall-android
          path: android/build/outputs/apk/**/*.apk

  desktop:
    name: Desktop package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
          - os: macos-latest
            task: packageDmg
          - os: ubuntu-latest
            task: packageDeb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        run: ./gradlew :desktop:${{ matrix.task }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: zoocall-desktop-${{ matrix.os }}
          path: desktop/build/compose/binaries/main/*/*
